name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.8.6 numpy pytest
      # Erreurs bloquantes seulement (syntaxe, noms indéfinis, imports cassés).
      - run: ruff check --select E9,F63,F7,F82 .
      - run: pytest -q c1/test_metric.py c2/test_analyze.py c2/test_features.py
