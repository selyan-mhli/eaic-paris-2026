<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" data-pptx-page-role="content" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrowHead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <polygon points="0,0 10,5 0,10" fill="#6B6A66"/>
    </marker>
  </defs>
  <rect id="bg" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#FAF8F3"/>
  <g id="header" data-pptx-bounds="64 48 1152 88">
    <text x="64" y="70" font-size="18" fill="#6B6A66" letter-spacing="2">MÉTHODE</text>
    <text x="64" y="114" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="44" fill="#1F2A44">Une règle fixée avant de lire le résultat</text>
  </g>
  <g id="rule-band" data-pptx-bounds="64 142 1152 72">
    <rect x="64" y="146" width="1152" height="64" rx="4" fill="#EFEBE1"/>
    <rect x="64" y="146" width="6" height="64" fill="#C2410C"/>
    <text x="96" y="188" font-size="28" fill="#22252B">On soumet seulement si <tspan font-weight="bold" fill="#C2410C">gain apparié ≥ +0,01</tspan> et <tspan font-weight="bold" fill="#C2410C">IC95 bas &gt; 0</tspan></text>
  </g>
  <g id="decision-loop" data-pptx-bounds="64 236 560 396">
    <g id="step-hypothese">
      <rect x="64" y="246" width="520" height="72" rx="4" fill="#FFFFFF" stroke="#D9D3C4" stroke-width="1"/>
      <text x="88" y="292" font-size="28" fill="#C2410C" font-weight="bold">1</text>
      <text x="124" y="292" font-size="28" fill="#22252B">Hypothèse</text>
      <use data-icon="tabler-outline/flask" x="532" y="264" width="36" height="36" fill="#6B6A66" stroke-width="2"/>
    </g>
    <line x1="324" y1="320" x2="324" y2="356" stroke="#6B6A66" stroke-width="2" marker-end="url(#arrowHead)"/>
    <g id="step-mesure">
      <rect x="64" y="362" width="520" height="72" rx="4" fill="#FFFFFF" stroke="#D9D3C4" stroke-width="1"/>
      <text x="88" y="408" font-size="28" fill="#C2410C" font-weight="bold">2</text>
      <text x="124" y="408" font-size="28" fill="#22252B">Mesure locale appariée</text>
      <use data-icon="tabler-outline/ruler-measure" x="532" y="380" width="36" height="36" fill="#6B6A66" stroke-width="2"/>
    </g>
    <line x1="324" y1="436" x2="324" y2="472" stroke="#6B6A66" stroke-width="2" marker-end="url(#arrowHead)"/>
    <g id="step-decision">
      <rect x="64" y="478" width="520" height="72" rx="4" fill="#FFFFFF" stroke="#D9D3C4" stroke-width="1"/>
      <text x="88" y="524" font-size="28" fill="#C2410C" font-weight="bold">3</text>
      <text x="124" y="524" font-size="28" fill="#22252B">Décision figée d'avance</text>
      <use data-icon="tabler-outline/target" x="532" y="496" width="36" height="36" fill="#6B6A66" stroke-width="2"/>
    </g>
    <text x="64" y="584" font-size="18" fill="#6B6A66">Bootstrap apparié, 2 000 tirages</text>
    <text x="64" y="612" font-size="18" fill="#6B6A66">Issues : POURSUIVRE · DIAGNOSTIC · ABANDON</text>
  </g>
  <g id="validation-quality" data-pptx-bounds="680 236 536 396">
    <text x="680" y="276" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="32" fill="#1F2A44">Validation locale</text>
    <line x1="680" y1="296" x2="1216" y2="296" stroke="#D9D3C4" stroke-width="1"/>
    <g id="quality-t1">
      <circle cx="692" cy="340" r="7" fill="#C2410C"/>
      <circle cx="712" cy="340" r="7" fill="#C2410C"/>
      <circle cx="732" cy="340" r="7" fill="#C2410C"/>
      <text x="756" y="350" font-size="28" fill="#22252B"><tspan font-weight="bold">T1</tspan> forte</text>
      <text x="756" y="380" font-size="18" fill="#6B6A66">510 images avec masques, CV 5 folds</text>
    </g>
    <g id="quality-t2">
      <circle cx="692" cy="440" r="7" fill="#2F6F73"/>
      <circle cx="712" cy="440" r="7" fill="#2F6F73"/>
      <circle cx="732" cy="440" r="6" fill="none" stroke="#2F6F73" stroke-width="2"/>
      <text x="756" y="450" font-size="28" fill="#22252B"><tspan font-weight="bold">T2</tspan> moyenne</text>
      <text x="756" y="480" font-size="18" fill="#6B6A66">9 endpoints de référence, 100 requêtes par endpoint</text>
    </g>
    <g id="quality-t3">
      <circle cx="692" cy="540" r="7" fill="#2F6F73"/>
      <circle cx="712" cy="540" r="6" fill="none" stroke="#2F6F73" stroke-width="2"/>
      <circle cx="732" cy="540" r="6" fill="none" stroke="#2F6F73" stroke-width="2"/>
      <text x="756" y="550" font-size="28" fill="#22252B"><tspan font-weight="bold">T3</tspan> faible</text>
      <text x="756" y="580" font-size="18" fill="#6B6A66">ni modèle gold, ni données retain</text>
    </g>
  </g>
  <g id="source" data-pptx-bounds="64 648 1152 36">
    <text x="64" y="672" font-size="18" fill="#6B6A66">Source : journal d'expériences et registre de coordination de l'équipe</text>
  </g>
</svg>
